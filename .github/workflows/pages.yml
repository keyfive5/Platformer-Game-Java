name: Publish the remaster

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild levels.js from the original 2019 Tiled maps
        run: |
          node tools/tmx2js.mjs
          git diff --exit-code docs/js/levels.js \
            || (echo "::error::docs/js/levels.js is out of date - run node tools/tmx2js.mjs" && exit 1)

      - name: Syntax-check the game sources
        run: for f in docs/js/*.js; do node --check "$f"; done

      # Pages serves the gh-pages branch, so docs/ is published as the site root.
      # Done with plain git rather than the Pages API, which the default token
      # is not allowed to call on this repo.
      - name: Publish docs/ to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .publish && mkdir .publish
          cp -r docs/. .publish/
          touch .publish/.nojekyll
          cd .publish
          git init -q -b gh-pages
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
