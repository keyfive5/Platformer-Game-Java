name: Deploy the remaster to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild levels.js from the original 2019 Tiled maps
        run: |
          node tools/tmx2js.mjs
          git diff --exit-code docs/js/levels.js \
            || (echo "::error::docs/js/levels.js is out of date - run node tools/tmx2js.mjs" && exit 1)

      - name: Syntax-check the game sources
        run: for f in docs/js/*.js; do node --check "$f"; done

      # enablement:true turns Pages on for the repo the first time this runs,
      # so nothing has to be switched on by hand in Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
